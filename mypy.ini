[mypy]
# Type check source code only
files = src
explicit_package_bases = True

# Exclude test directories and virtual environment
exclude = (^src/.*/tests/|^\.venv/)

# Type checking settings - lenient for now to unblock CI
python_version = 3.11
warn_return_any = False
warn_unused_configs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_calls = False
ignore_missing_imports = True
follow_imports = silent

# Suppress specific errors for external libraries
[mypy-yfinance.*]
ignore_missing_imports = True

[mypy-alpaca.*]
ignore_missing_imports = True

[mypy-telegram.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_errors = True

[mypy-flask.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
